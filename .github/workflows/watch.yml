name: Deprecation Watch

on:
  schedule:
    - cron: "0 5 * * *" # daily at 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show results, do not create issues or save state"
        type: boolean
        default: false
      test_rewind:
        description: "Test: check GitHub sources as if the last check was N commits ago (forces dry run)"
        type: number
        default: 0

permissions:
  contents: write # commit state (state/) and diffs (reports/) back
  issues: write # create report issues

concurrency:
  group: deprecation-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_REWIND: ${{ inputs.test_rewind }}
        run: python watch.py

      - name: Save state
        if: ${{ !inputs.dry_run && !(inputs.test_rewind > 0) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "chore: deprecation-watch state $(date -u +%F)"
          git push
