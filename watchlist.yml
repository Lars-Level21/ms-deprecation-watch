# Pages that are checked for changes every day.
#
# source: github  -> commits + diff of the Markdown file in the public MicrosoftDocs repo.
#                    Find repo/path via the edit pencil on the Learn page
#                    (or in the HTML meta tag "original_content_git_url"; it points to the
#                    private "-pr" repo – for the watchlist, drop the "-pr" suffix
#                    and use branch "main" instead of "live").
# source: learn   -> fallback for pages without a public repo: the text content of the
#                    rendered page is stored as a snapshot and compared.
#
# "id" must be unique (it is used for the stored state).
# "short" appears in the issue title and as a label.

pages:
  # --- Power Platform (also covers Power Automate, Dataverse, AI Builder, model-driven) ---
  - id: power-platform
    short: Power Platform
    name: Important changes (deprecations) coming in Power Platform
    url: https://learn.microsoft.com/en-us/power-platform/important-changes-coming
    source: github
    repo: MicrosoftDocs/power-platform
    branch: main
    path: power-platform/important-changes-coming.md

  - id: canvas-apps
    short: Canvas Apps
    name: Important upcoming changes (deprecations) in canvas apps
    url: https://learn.microsoft.com/en-us/power-apps/maker/canvas-apps/important-changes-deprecations
    source: github
    repo: MicrosoftDocs/powerapps-docs
    branch: main
    path: powerapps-docs/maker/canvas-apps/important-changes-deprecations.md

  - id: power-pages
    short: Power Pages
    name: Important upcoming changes and deprecations in Power Pages
    url: https://learn.microsoft.com/en-us/power-pages/important-changes-deprecations
    source: github
    repo: MicrosoftDocs/power-pages-docs
    branch: main
    path: power-pages-docs/important-changes-deprecations.md

  # --- Dynamics 365 CE ---
  - id: d365-customer-service
    short: D365 Customer Service
    name: Deprecations in Dynamics 365 Customer Service
    url: https://learn.microsoft.com/en-us/dynamics365/customer-service/implement/deprecations-customer-service
    source: github
    repo: MicrosoftDocs/dynamics-365-customer-engagement
    branch: main
    path: ce/customer-service/implement/deprecations-customer-service.md

  - id: d365-sales
    short: D365 Sales
    name: Removed or deprecated features in Dynamics 365 Sales
    url: https://learn.microsoft.com/en-us/dynamics365/sales/deprecations-sales
    source: github
    repo: MicrosoftDocs/dynamics-365-customer-engagement
    branch: main
    path: ce/sales/deprecations-sales.md

  - id: d365-field-service
    short: D365 Field Service
    name: Feature deprecations – Dynamics 365 Field Service
    url: https://learn.microsoft.com/en-us/dynamics365/field-service/deprecations-field-service
    source: github
    repo: MicrosoftDocs/dynamics-365-customer-engagement
    branch: main
    path: ce/field-service/deprecations-field-service.md

  # --- Copilot Studio (no public docs repo -> Learn snapshot) ---
  - id: copilot-studio-whats-new
    short: Copilot Studio
    name: What's new in Copilot Studio (Notable changes / Retirements)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/whats-new
    source: learn

  - id: copilot-studio-models
    short: Copilot Studio
    name: Copilot Studio – Select a primary AI model (model availability & retirements)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-select-agent-model
    source: learn

  - id: copilot-studio-retired-models
    short: Copilot Studio
    name: Copilot Studio – Continue using a retired AI model
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-retired-model
    source: learn
